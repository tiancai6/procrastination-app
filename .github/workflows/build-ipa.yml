name: Build iOS IPA (unsigned)

# 触发：① 推送到 main/master 自动构建；② 也可以在 GitHub 网页「Actions → 此工作流 → Run workflow」手动触发
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    # 必须在 macOS 上编译 iOS（Xcode 只能跑在 Mac）。GitHub 公共仓库的 macOS 分钟免费。
    runs-on: macos-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm install

      - name: 安装 CocoaPods（iOS 原生依赖管理）
        run: brew install cocoapods

      - name: 生成 iOS 原生工程（expo prebuild，--clean 会先清掉旧的 ios 目录）
        run: npx expo prebuild --platform ios --clean
        env:
          EXPO_NO_TELEMETRY: "1"

      - name: 安装 iOS 原生依赖（pod install）
        run: cd ios && pod install

      - name: 定位 Xcode 工程（动态读取，避免中文工程名写死）
        id: locate
        run: |
          cd ios
          WS=$(ls -d *.xcworkspace | head -n1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "workspace=$WS" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "检测到工程: $WS / scheme: $SCHEME"

      - name: 编译为未签名 xcarchive
        run: |
          cd ios
          export PATH="$PATH:$(dirname $(which node))"
          xcodebuild -workspace "${{ steps.locate.outputs.workspace }}" \
            -scheme "${{ steps.locate.outputs.scheme }}" \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: 手工打包为未签名 IPA（Sideloadly 会在你电脑上重签）
        run: |
          cd ios
          APP=$(find build/App.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -n1)
          echo "找到 App: $APP"
          mkdir -p build/Payload
          cp -r "$APP" build/Payload/
          cd build && zip -r ../dailytrace.ipa Payload && cd ..
          echo "生成 IPA: $(pwd)/dailytrace.ipa"

      - name: 校验 JS 包已打入（防止白屏）
        run: |
          cd ios
          APP=$(find build/App.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -n1)
          if ! ls "$APP"/*.jsbundle >/dev/null 2>&1; then
            echo "ERROR: JS bundle (*.jsbundle) 未嵌入 App，会导致白屏！"
            exit 1
          fi
          echo "JS bundle 已正确嵌入: $(ls "$APP"/*.jsbundle)"

      - name: 上传 IPA 作为构建产物（在 Actions 运行页的 Artifacts 下载）
        uses: actions/upload-artifact@v4
        with:
          name: dailytrace-unsigned-ipa
          path: ios/dailytrace.ipa
